name: EAS Update

on:
  push:
    branches:
      - main

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure production API URL exists in EAS
        run: npx eas-cli env:set --name EXPO_PUBLIC_API_URL --value "$EXPO_PUBLIC_API_URL" --environment production --visibility plaintext --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: https://dzwan.vercel.app/api

      - name: Publish OTA update
        run: npx eas-cli update --channel production --platform android --environment production --message "Android production OTA - GitHub commit ${{ github.sha }}" --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}